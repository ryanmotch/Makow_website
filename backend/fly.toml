app = "makow-genealogy-api"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/makow.db"
  CORS_ORIGIN = "https://makow-genealogy.fly.dev"

[mounts]
  source = "makow_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
